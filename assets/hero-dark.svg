<line x1="790" y1="150" x2="735" y2="252" class="flow" style="animation-delay:-2.22s"/>
<line x1="880" y1="70" x2="900" y2="232" class="flow" style="animation-delay:-2.59s"/>
<rect x="680.7" y="63" width="38.6" height="30" rx="15" class="pulse" style="animation-delay:0.0s"/>
<rect x="680.7" y="63" width="38.6" height="30" rx="15" class="node"/>
<text x="700" y="82" text-anchor="middle" class="label">api</text>
<rect x="856.6" y="55" width="46.8" height="30" rx="15" class="pulse" style="animation-delay:0.6s"/>
<rect x="856.6" y="55" width="46.8" height="30" rx="15" class="node"/>
<text x="880" y="74" text-anchor="middle" class="label">auth</text>
