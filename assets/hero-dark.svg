<line x1="880" y1="70" x2="900" y2="232" class="edge"/>
<line x1="700" y1="78" x2="790" y2="150" class="flow" style="animation-delay:-0.00s"/>
<line x1="880" y1="70" x2="790" y2="150" class="flow" style="animation-delay:-0.37s"/>
<line x1="790" y1="150" x2="640" y2="205" class="flow" style="animation-delay:-0.74s"/>
<line x1="790" y1="150" x2="900" y2="232" class="flow" style="animation-delay:-1.11s"/>
<line x1="640" y1="205" x2="735" y2="252" class="flow" style="animation-delay:-1.48s"/>
