<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Igor Strelchenya, Backend Software Engineer, Java and Kotlin">
<defs>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f89820"/><stop offset="0.55" stop-color="#e44d8a"/><stop offset="1" stop-color="#7f52ff"/></linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1b2129"/></pattern>
<clipPath id="card"><rect x="1" y="1" width="998" height="298" rx="18"/></clipPath>
<style>
    .name { font: 700 46px 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif; fill: #e6edf3; letter-spacing: -0.5px; }
    .role { font: 600 20px 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif; fill: url(#accent); }
    .mono { font: 400 15px 'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; fill: #8b949e; }
    .label { font: 500 12px 'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; fill: #8b949e; }
    .meta { font: 500 13px 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif; fill: #8b949e; }
    .phrase { font: 500 17px 'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; fill: #e6edf3; }
    .edge { stroke: #30363d; stroke-width: 1.5; fill: none; }
    .flow { stroke: url(#accent); stroke-width: 2; fill: none; stroke-linecap: round;
             stroke-dasharray: 6 22; animation: flow 2.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -56; } }
    .node { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .pulse { fill: none; stroke: url(#accent); stroke-width: 1.5; opacity: 0;
              transform-box: fill-box; transform-origin: center;
              animation: pulse 3.6s ease-out infinite; }
    @keyframes pulse { 0% { opacity: .7; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(1.35); } }
    .cursor { fill: url(#accent); animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    </style>
</defs>
<rect x="1" y="1" width="998" height="298" rx="18" fill="#0d1117" stroke="#30363d"/>
<g clip-path="url(#card)">
<rect x="560" y="0" width="440" height="300" fill="url(#grid)"/>
<rect x="0" y="0" width="1000" height="4" fill="url(#accent)"/>
</g>
<text x="56" y="62" class="mono">~/strelchenya<tspan fill="url(#accent)"> $</tspan> whoami</text>
<rect x="252" y="50" width="9" height="16" class="cursor"/>
<text x="54" y="124" class="name">Igor Strelchenya</text>
<text x="56" y="158" class="role">Backend Software Engineer · Java / Kotlin</text>
<text x="56" y="212" class="mono" fill="url(#accent)">›</text>
<text x="76" y="212" class="phrase" opacity="0">distributed systems on the JVM<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.22;0.25;0.97;1" dur="12s" begin="0s" repeatCount="indefinite"/></text>
<text x="76" y="212" class="phrase" opacity="0">reactive microservices with Spring WebFlux<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.22;0.25;0.97;1" dur="12s" begin="3s" repeatCount="indefinite"/></text>
<text x="76" y="212" class="phrase" opacity="0">integration-heavy platforms that move money<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.22;0.25;0.97;1" dur="12s" begin="6s" repeatCount="indefinite"/></text>
<text x="76" y="212" class="phrase" opacity="0">secure, observable, production-ready services<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.22;0.25;0.97;1" dur="12s" begin="9s" repeatCount="indefinite"/></text>
<text x="56" y="256" class="meta">Minsk, Belarus  ·  JVM backend  ·  FinTech</text>
<line x1="700" y1="78" x2="790" y2="150" class="edge"/>
<line x1="880" y1="70" x2="790" y2="150" class="edge"/>
<line x1="790" y1="150" x2="640" y2="205" class="edge"/>
<line x1="790" y1="150" x2="900" y2="232" class="edge"/>
